<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kryoset — Shared file</title>
<link href="/static/share.css" rel="stylesheet"/>
</head>
<body>
<div class="card">
<div class="logo"><span>kryoset</span>.nas — shared file</div>
<div class="share-loading" id="loading">
    Loading…
  </div>
<div class="hidden" id="valid-state">
<span class="file-icon" id="file-icon"><svg fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg></span>
<div class="file-name" id="file-name"></div>
<div class="meta" id="file-meta"></div>
<div class="hidden" id="pwd-section">
<div class="field">
<label>Password required</label>
<input id="pwd-input" placeholder="Enter link password" type="password"/>
</div>
</div>
<button class="btn btn-primary" data-action="download" id="dl-btn">
      ↓ Download
    </button>
<div id="dl-msg"></div>
</div>
<div class="hidden" id="error-state">
<div class="state-expired">
<span class="big"><svg fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg"><rect height="11" rx="2" width="18" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
<div id="error-text"></div>
</div>
</div>
</div>
<footer>
<a href="/">← Back to Kryoset</a> · <a href="/privacy">Confidentialité</a>
</footer>
<script defer="" src="/static/share.js"></script>
</body>
</html>
