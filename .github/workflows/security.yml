name: security

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '23 3 * * 1'

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Semgrep security rules
        run: python -m semgrep scan --config .semgrep/kryoset.yml --error
      - name: Detect committed secrets
        run: detect-secrets scan --baseline .secrets.baseline --exclude-files '^(.git/|dist/|build/|.*\.egg-info/)'
